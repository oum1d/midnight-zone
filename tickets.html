<main id="main" class="page page--deep" data-tickets-page>

  <div class="page__hero">
    <div class="wrap">
      <span class="label" data-i18n="nav.tickets"></span>
      <h1 data-i18n="tickets.h1"></h1>
      <p class="lead" data-i18n="tickets.lead"></p>
    </div>
  </div>

  <section class="section--tight">
    <div class="wrap">
      <h2 class="visually-hidden" data-i18n="tickets.tariffsTitle"></h2>
      <div class="switch mb-5" role="group" data-i18n-attr="aria-label:tickets.priceMode">
        <input type="radio" name="price-mode" id="mode-weekday" data-mode="weekday" checked>
        <label for="mode-weekday" data-i18n="tickets.weekday"></label>
        <input type="radio" name="price-mode" id="mode-weekend" data-mode="weekend">
        <label for="mode-weekend" data-i18n="tickets.weekend"></label>
      </div>
      <div class="tariffs mt-5" data-tariffs></div>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="split split--sticky">

        <div>
          <!-- Календарь -->
          <div class="panel" data-calendar>
            <div class="cal__head">
              <button type="button" class="cal__nav" data-cal-prev data-i18n-attr="aria-label:tickets.monthPrev">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
              </button>
              <span class="cal__month" data-cal-month></span>
              <button type="button" class="cal__nav" data-cal-next data-i18n-attr="aria-label:tickets.monthNext">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
              </button>
            </div>
            <h2 class="visually-hidden" data-i18n="tickets.calendarTitle"></h2>
            <div class="cal__weekdays" data-cal-weekdays aria-hidden="true"></div>
            <div class="cal__grid" data-cal-grid></div>
            <div class="cal__legend" data-legend></div>
            <p class="form__note mt-4" data-i18n="tickets.closedNote"></p>
          </div>

          <!-- Сеансы -->
          <div class="mt-6">
            <h2 class="h3 mb-3" data-i18n="tickets.sessionsTitle"></h2>
            <p class="form__note" data-sessions-hint></p>
            <div class="sessions mt-4" data-sessions></div>
          </div>

          <!-- Что нельзя -->
          <div class="warn mt-7">
            <div class="warn__head">
              <svg class="warn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
                <circle cx="12" cy="12" r="9"/><path d="M6 18 18 6"/>
              </svg>
              <h2 data-i18n="tickets.rulesTitle"></h2>
            </div>
            <ul data-rules></ul>
          </div>
        </div>

        <!-- Калькулятор и оформление -->
        <div>
          <div class="panel panel--pad">
            <h2 class="h3" data-i18n="tickets.calcTitle"></h2>
            <div class="mt-4" data-calc></div>

            <div class="calc__total">
              <span class="calc__total-label" data-i18n="common.total"></span>
              <span class="calc__total-value" data-total aria-live="polite">0 zł</span>
            </div>
            <p class="form__note mt-3" data-order-summary></p>

            <form class="form mt-6" data-form="tickets" novalidate>
              <div class="hp" aria-hidden="true">
                <label for="t-website">Website</label>
                <input type="text" id="t-website" name="website" tabindex="-1" autocomplete="off">
              </div>

              <div class="field">
                <label class="field__label" for="t-name"><span data-i18n="forms.name"></span> <span class="req">*</span></label>
                <input class="input" type="text" id="t-name" name="name" required autocomplete="name"
                       data-i18n-attr="placeholder:forms.namePh">
                <p class="field__error" id="t-name-error"></p>
              </div>

              <div class="field">
                <label class="field__label" for="t-email"><span data-i18n="forms.email"></span> <span class="req">*</span></label>
                <input class="input" type="email" id="t-email" name="email" required autocomplete="email"
                       data-i18n-attr="placeholder:forms.emailPh">
                <p class="field__error" id="t-email-error"></p>
              </div>

              <div class="field">
                <label class="field__label" for="t-phone" data-i18n="forms.phone"></label>
                <input class="input" type="tel" id="t-phone" name="phone" autocomplete="tel"
                       data-i18n-attr="placeholder:forms.phonePh">
                <p class="field__error" id="t-phone-error"></p>
              </div>

              <div class="field">
                <label class="check">
                  <input type="checkbox" name="consent" required>
                  <span>
                    <span data-i18n="forms.consent"></span><br>
                    <a href="privacy.html" data-i18n="forms.consentLink"></a>
                  </span>
                </label>
                <p class="field__error" id="t-consent-error"></p>
              </div>

              <p class="form__alert" data-form-alert hidden></p>

              <button class="btn btn--primary btn--wide" type="submit" data-i18n="forms.submitTickets"></button>
              <p class="form__note" data-i18n="forms.demoNote"></p>
            </form>

            <div class="form__success" data-success hidden>
              <h3 data-success-title data-i18n="forms.successTitle"></h3>
              <p data-success-text></p>
              <button class="btn btn--sm mt-4" type="button" data-success-again data-i18n="forms.successAgain"></button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </section>

</main>
