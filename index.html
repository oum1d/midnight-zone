<!-- Прелоадер: трос уходит вниз, проценты моноширинными цифрами.
     Живёт не дольше 600 мс и снимается по таймеру при любой ошибке. -->
<div class="preloader" role="status" aria-live="polite">
  <div class="preloader__inner">
    <span class="preloader__label" data-i18n="preloader.label"></span>
    <span class="preloader__rope" aria-hidden="true"></span>
    <span class="preloader__num mono">0%</span>
  </div>
  <button type="button" class="preloader__skip" data-i18n="preloader.skip"></button>
</div>

<div class="wave" aria-hidden="true"><div class="wave__body"></div></div>
<div class="grain" aria-hidden="true"></div>

<a class="skip-link" href="#main" data-i18n="nav.skip"></a>

<!-- Тексты сайта подставляются скриптом из словарей трёх языков. Если
     JavaScript выключен, страница осталась бы пустой — поэтому здесь лежит
     минимум, ради которого человек и пришёл: что, где, когда и почём. -->
<noscript>
  <div class="noscript">
    <h2>STREFA PÓŁNOCY / ЗОНА ПОЛУНОЧИ / THE MIDNIGHT ZONE</h2>
    <p>Wystawa o głębinach oceanu. Muzeum Morskie, ul. Portowa 12, Gdynia.
       3.10.2026 — 7.02.2027, wtorek–niedziela 10:00–20:00, ostatnie wejście 19:00.
       Bilety: 45 / 28 / 130 zł. Kontakt: kontakt@strefa-polnocy.example, +48 000 000 000.</p>
    <p>Strona przełącza języki skryptem — włącz JavaScript, aby zobaczyć pełną wersję.</p>
  </div>
</noscript>

<main id="main">

  <div class="dive">
    <!-- Сцена: фон, свет, взвесь, существа, фонарь. Целиком декоративна. -->
    <div class="dive__stage" aria-hidden="true">
      <div class="dive__bg"></div>
      <div class="dive__beam"></div>
      <canvas class="dive__particles"></canvas>
      <div class="dive__creatures"></div>
      <div class="dive__dark"></div>
      <div class="dive__vignette"></div>
    </div>

    <div class="dive__scenes">

      <!-- 0 м · Поверхность -->
      <section class="scene scene--surface" data-depth="0">
        <div class="scene__inner">
          <span class="scene__label" data-i18n="dive.surface.label"></span>
          <h1 class="scene__h" data-i18n="dive.surface.h1"></h1>
          <p class="scene__p lead" data-i18n="dive.surface.sub"></p>
          <div class="scene__meta">
            <span data-i18n="dive.surface.dates"></span>
            <span data-i18n="dive.surface.place"></span>
          </div>
          <div class="scene__actions">
            <a class="btn btn--primary" href="tickets.html" data-i18n="nav.buy"></a>
            <a class="btn" href="#scene-epi" data-i18n="dive.surface.cta"></a>
          </div>
        </div>
        <div class="scroll-hint" aria-hidden="true">
          <span class="scroll-hint__line"></span>
          <span data-i18n="dive.hint"></span>
        </div>
      </section>

      <!-- 200 м · Эпипелагиаль -->
      <section class="scene" id="scene-epi" data-depth="200">
        <div class="scene__inner">
          <span class="scene__label" data-i18n="dive.epi.label"></span>
          <div class="scene__text">
            <h2 class="scene__h" data-i18n="dive.epi.h2"></h2>
            <p class="scene__p" data-i18n="dive.epi.text"></p>
          </div>
          <div class="facts mt-6">
            <div class="fact">
              <div class="fact__label" data-i18n="dive.facts.depth"></div>
              <div class="fact__value"><span data-count-to="200">200</span><span class="fact__unit" data-i18n="common.metres"></span></div>
            </div>
            <div class="fact">
              <div class="fact__label" data-i18n="dive.facts.temp"></div>
              <div class="fact__value">+<span data-count-to="12">12</span><span class="fact__unit">°C</span></div>
            </div>
            <div class="fact">
              <div class="fact__label" data-i18n="dive.facts.pressure"></div>
              <div class="fact__value"><span data-count-to="21">21</span><span class="fact__unit">atm</span></div>
            </div>
            <div class="fact">
              <div class="fact__label" data-i18n="dive.facts.light"></div>
              <div class="fact__value" data-i18n="dive.lightOne"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- 1000 м · Сумеречная зона -->
      <section class="scene" data-depth="1000">
        <div class="scene__inner">
          <span class="scene__label" data-i18n="dive.twilight.label"></span>
          <div class="scene__text">
            <h2 class="scene__h" data-i18n="dive.twilight.h2"></h2>
            <p class="scene__p" data-i18n="dive.twilight.text"></p>
          </div>
          <div class="facts mt-6">
            <div class="fact">
              <div class="fact__label" data-i18n="dive.facts.depth"></div>
              <div class="fact__value"><span data-count-to="1000">1 000</span><span class="fact__unit" data-i18n="common.metres"></span></div>
            </div>
            <div class="fact">
              <div class="fact__label" data-i18n="dive.facts.temp"></div>
              <div class="fact__value">+<span data-count-to="4">4</span><span class="fact__unit">°C</span></div>
            </div>
            <div class="fact">
              <div class="fact__label" data-i18n="dive.facts.pressure"></div>
              <div class="fact__value"><span data-count-to="101">101</span><span class="fact__unit">atm</span></div>
            </div>
            <div class="fact">
              <div class="fact__label" data-i18n="dive.facts.light"></div>
              <div class="fact__value" data-i18n="dive.lightNone"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- 4000 м · Зона полуночи. Здесь собирается название выставки -->
      <section class="scene scene--midnight" data-depth="4000">
        <div class="scene__inner">
          <span class="scene__label" data-i18n="dive.midnight.label"></span>
          <h2 class="dive__title"></h2>
          <div class="scene__text">
            <p class="scene__h" data-i18n="dive.midnight.h2"></p>
            <p class="scene__p" data-i18n="dive.midnight.text"></p>
          </div>
          <blockquote class="scene__quote">
            <p data-i18n="dive.midnight.quote"></p>
            <footer data-i18n="dive.midnight.quoteAuthor"></footer>
          </blockquote>
          <div class="facts mt-7">
            <div class="fact">
              <div class="fact__label" data-i18n="dive.facts.depth"></div>
              <div class="fact__value"><span data-count-to="4000">4 000</span><span class="fact__unit" data-i18n="common.metres"></span></div>
            </div>
            <div class="fact">
              <div class="fact__label" data-i18n="dive.facts.temp"></div>
              <div class="fact__value">+<span data-count-to="2">2</span><span class="fact__unit">°C</span></div>
            </div>
            <div class="fact">
              <div class="fact__label" data-i18n="dive.facts.pressure"></div>
              <div class="fact__value"><span data-count-to="401">401</span><span class="fact__unit">atm</span></div>
            </div>
            <div class="fact">
              <div class="fact__label" data-i18n="dive.facts.light"></div>
              <div class="fact__value" data-i18n="dive.lightNone"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- 6000 м · Абиссаль -->
      <section class="scene" data-depth="6000">
        <div class="scene__inner">
          <span class="scene__label" data-i18n="dive.abyssal.label"></span>
          <div class="scene__text">
            <h2 class="scene__h" data-i18n="dive.abyssal.h2"></h2>
            <p class="scene__p" data-i18n="dive.abyssal.text"></p>
          </div>
          <h3 class="label mt-7" data-i18n="dive.abyssal.highlights"></h3>
          <div class="highlights" data-highlights></div>
        </div>
      </section>

      <!-- 11 000 м · Хадаль. Дно и единственная кнопка -->
      <section class="scene scene--hadal" data-depth="11000">
        <div class="scene__inner">
          <span class="scene__label" data-i18n="dive.hadal.label"></span>
          <div class="scene__text">
            <h2 class="scene__h" data-i18n="dive.hadal.h2"></h2>
            <p class="scene__p" data-i18n="dive.hadal.text"></p>
          </div>
          <div class="facts mt-6">
            <div class="fact">
              <div class="fact__label" data-i18n="dive.facts.depth"></div>
              <div class="fact__value"><span data-count-to="11000">11 000</span><span class="fact__unit" data-i18n="common.metres"></span></div>
            </div>
            <div class="fact">
              <div class="fact__label" data-i18n="dive.facts.temp"></div>
              <div class="fact__value">+<span data-count-to="1">1</span><span class="fact__unit">°C</span></div>
            </div>
            <div class="fact">
              <div class="fact__label" data-i18n="dive.facts.pressure"></div>
              <div class="fact__value"><span data-count-to="1100">1 100</span><span class="fact__unit">atm</span></div>
            </div>
            <div class="fact">
              <div class="fact__label" data-i18n="dive.facts.light"></div>
              <div class="fact__value" data-i18n="dive.lightNone"></div>
            </div>
          </div>
          <div class="scene__actions mt-7">
            <a class="btn btn--primary" href="tickets.html" data-i18n="dive.hadal.cta"></a>
            <a class="btn btn--glow" href="schools.html" data-i18n="dive.hadal.ctaSchools"></a>
          </div>
        </div>
      </section>

    </div>
  </div>

  <!-- Шкала глубины. Показания приборов, а не содержание: скринридеру они
       не нужны и только мешали бы постоянными обновлениями. -->
  <aside class="scale" aria-hidden="true">
    <div class="scale__rail">
      <svg class="scale__rope" viewBox="0 0 22 400" preserveAspectRatio="none">
        <path class="scale__rope-track" d="M11 0 C 4 60, 18 120, 11 200 S 4 320, 11 400" pathLength="1"/>
        <path class="scale__rope-line" d="M11 0 C 4 60, 18 120, 11 200 S 4 320, 11 400"
              pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
      </svg>
      <div class="scale__ticks">
        <div class="scale__marker"></div>
      </div>
    </div>
    <div class="scale__readout">
      <span class="scale__depth">−00 000 м</span>
      <span class="scale__zone"></span>
    </div>
  </aside>

  <!-- Всплытие. Свет включается резко — так и задумано -->
  <section class="surfaced is-day">
    <div class="surfaced__top">
      <div class="wrap">
        <span class="surfaced__label" data-i18n="dive.surfaced.label"></span>
        <p class="lead" data-i18n="dive.surfaced.note"></p>
      </div>
    </div>
    <div class="wrap section--tight">
      <div class="grid grid--4">
        <a class="panel" href="halls.html">
          <h2 class="h3" data-i18n="nav.halls"></h2>
          <p class="form__note" data-i18n="halls.lead"></p>
        </a>
        <a class="panel" href="tickets.html">
          <h2 class="h3" data-i18n="nav.tickets"></h2>
          <p class="form__note" data-i18n="tickets.lead"></p>
        </a>
        <a class="panel" href="schools.html">
          <h2 class="h3" data-i18n="nav.schools"></h2>
          <p class="form__note" data-i18n="schools.lead"></p>
        </a>
        <a class="panel" href="visit.html">
          <h2 class="h3" data-i18n="nav.visit"></h2>
          <p class="form__note" data-i18n="visit.hours"></p>
        </a>
      </div>
    </div>
  </section>

</main>
