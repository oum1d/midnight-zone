<main id="main" class="page page--deep">

  <div class="page__hero">
    <div class="wrap">
      <span class="label" data-i18n="nav.visit"></span>
      <h1 data-i18n="visit.h1"></h1>
      <p class="lead" data-i18n="visit.address"></p>
      <p class="form__note" data-i18n="visit.addressNote"></p>
    </div>
  </div>

  <section class="section">
    <div class="wrap">
      <div class="split">

        <div>
          <h2 class="mb-4" data-i18n="visit.transportTitle"></h2>
          <ul class="list-plain" data-transport></ul>

          <h2 class="mt-7 mb-4" data-i18n="visit.hoursTitle"></h2>
          <p data-i18n="visit.hours"></p>
        </div>

        <div>
          <h2 class="mb-4" data-i18n="visit.mapTitle"></h2>
          <!-- Карта собирается на Leaflet из assets/vendor: никакого чужого
               кадра с рекламой, наружу уходят только плитки OpenStreetMap -->
          <div class="panel map-embed">
            <div class="map-embed__canvas" data-map data-lat="54.5240277" data-lon="18.5429987" data-zoom="16"
                 role="application" aria-label="Карта: ул. Портовая 12, Гдыня"
                 data-i18n-attr="aria-label:visit.mapTitle">
              <p class="map-embed__fallback">
                <span data-i18n="visit.address"></span> ·
                <a href="https://www.openstreetmap.org/?mlat=54.52403&amp;mlon=18.54300#map=16/54.52403/18.54300"
                   target="_blank" rel="noopener noreferrer">OpenStreetMap</a>
              </p>
            </div>
          </div>
          <p class="form__note mt-3" data-i18n="visit.mapNote"></p>
        </div>

      </div>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <h2 class="mb-5" data-i18n="visit.faqTitle"></h2>
      <div class="acc" data-faq></div>
    </div>
  </section>

  <section class="section--tight">
    <div class="wrap">
      <div class="split">
        <div>
          <h2 class="mb-4" data-i18n="visit.questionTitle"></h2>
          <p class="lead" data-i18n="visit.questionLead"></p>
        </div>
        <div>
          <form class="form" data-form="question" novalidate>
            <div class="hp" aria-hidden="true">
              <label for="q-website">Website</label>
              <input type="text" id="q-website" name="website" tabindex="-1" autocomplete="off">
            </div>

            <div class="form__row form__row--2">
              <div class="field">
                <label class="field__label" for="q-name"><span data-i18n="forms.name"></span> <span class="req">*</span></label>
                <input class="input" type="text" id="q-name" name="name" required autocomplete="name"
                       data-i18n-attr="placeholder:forms.namePh">
                <p class="field__error"></p>
              </div>
              <div class="field">
                <label class="field__label" for="q-email"><span data-i18n="forms.email"></span> <span class="req">*</span></label>
                <input class="input" type="email" id="q-email" name="email" required autocomplete="email"
                       data-i18n-attr="placeholder:forms.emailPh">
                <p class="field__error"></p>
              </div>
            </div>

            <div class="field">
              <label class="field__label" for="q-message"><span data-i18n="forms.message"></span> <span class="req">*</span></label>
              <textarea class="textarea" id="q-message" name="message" required
                        data-i18n-attr="placeholder:forms.messagePh"></textarea>
              <p class="field__error"></p>
            </div>

            <div class="field">
              <label class="check">
                <input type="checkbox" name="consent" required>
                <span>
                  <span data-i18n="forms.consent"></span><br>
                  <a href="privacy.html" data-i18n="forms.consentLink"></a>
                </span>
              </label>
              <p class="field__error"></p>
            </div>

            <p class="form__alert" data-form-alert hidden></p>

            <button class="btn btn--primary" type="submit" data-i18n="forms.submitQuestion"></button>
            <p class="form__note" data-i18n="forms.demoNote"></p>
          </form>

          <div class="form__success" data-success hidden>
            <h3 data-success-title data-i18n="forms.successTitle"></h3>
            <p data-success-text></p>
            <button class="btn btn--sm mt-4" type="button" data-success-again data-i18n="forms.successAgain"></button>
          </div>
        </div>
      </div>
    </div>
  </section>

</main>
