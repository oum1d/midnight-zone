<main id="main" class="page page--day is-day">

  <div class="page__hero">
    <div class="wrap">
      <span class="label" data-i18n="nav.schools"></span>
      <h1 data-i18n="schools.h1"></h1>
      <p class="lead" data-i18n="schools.lead"></p>
    </div>
  </div>

  <section class="section">
    <div class="wrap">
      <h2 class="mb-4" data-i18n="schools.programsTitle"></h2>
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th data-i18n="schools.programsTitle"></th>
              <th data-i18n="schools.age"></th>
              <th data-i18n="schools.duration"></th>
              <th data-i18n="schools.price"></th>
            </tr>
          </thead>
          <tbody data-programs></tbody>
        </table>
      </div>
    </div>
  </section>

  <section class="section--tight">
    <div class="wrap">
      <div class="split">
        <div>
          <h2 class="mb-4" data-i18n="schools.bringTitle"></h2>
          <ul data-bring></ul>
        </div>
        <div>
          <h2 class="mb-4" data-i18n="schools.filesTitle"></h2>
          <div class="files" data-files></div>
        </div>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="split">
        <div>
          <h2 class="mb-4" data-i18n="schools.formTitle"></h2>
          <p class="lead" data-i18n="schools.formLead"></p>
        </div>

        <div>
          <form class="form" data-form="school" novalidate>
            <div class="hp" aria-hidden="true">
              <label for="s-website">Website</label>
              <input type="text" id="s-website" name="website" tabindex="-1" autocomplete="off">
            </div>

            <div class="form__row form__row--2">
              <div class="field">
                <label class="field__label" for="s-school"><span data-i18n="forms.school"></span> <span class="req">*</span></label>
                <input class="input" type="text" id="s-school" name="school" required
                       data-i18n-attr="placeholder:forms.schoolPh">
                <p class="field__error"></p>
              </div>
              <div class="field">
                <label class="field__label" for="s-grade"><span data-i18n="forms.grade"></span> <span class="req">*</span></label>
                <input class="input" type="text" id="s-grade" name="grade" required
                       data-i18n-attr="placeholder:forms.gradePh">
                <p class="field__error"></p>
              </div>
            </div>

            <div class="field">
              <label class="field__label" for="s-program" data-i18n="forms.program"></label>
              <select class="select" id="s-program" name="program" data-program-select></select>
              <p class="field__error"></p>
            </div>

            <div class="form__row form__row--2">
              <div class="field">
                <label class="field__label" for="s-kids"><span data-i18n="forms.kids"></span> <span class="req">*</span></label>
                <input class="input" type="number" id="s-kids" name="kids" required min="10" max="30" value="20">
                <p class="field__error"></p>
              </div>
              <div class="field">
                <label class="field__label" for="s-date"><span data-i18n="forms.date"></span> <span class="req">*</span></label>
                <input class="input" type="date" id="s-date" name="date" required
                       min="2026-10-03" max="2027-02-07">
                <p class="field__error"></p>
              </div>
            </div>

            <div class="form__row form__row--2">
              <div class="field">
                <label class="field__label" for="s-teacher"><span data-i18n="forms.teacher"></span> <span class="req">*</span></label>
                <input class="input" type="text" id="s-teacher" name="teacher" required autocomplete="name"
                       data-i18n-attr="placeholder:forms.teacherPh">
                <p class="field__error"></p>
              </div>
              <div class="field">
                <label class="field__label" for="s-email"><span data-i18n="forms.email"></span> <span class="req">*</span></label>
                <input class="input" type="email" id="s-email" name="email" required autocomplete="email"
                       data-i18n-attr="placeholder:forms.emailPh">
                <p class="field__error"></p>
              </div>
            </div>

            <div class="field">
              <label class="field__label" for="s-phone" data-i18n="forms.phone"></label>
              <input class="input" type="tel" id="s-phone" name="phone" autocomplete="tel"
                     data-i18n-attr="placeholder:forms.phonePh">
              <p class="field__error"></p>
            </div>

            <div class="field">
              <label class="check">
                <input type="checkbox" name="consent" required>
                <span>
                  <span data-i18n="forms.consent"></span><br>
                  <a href="privacy.html" data-i18n="forms.consentLink"></a>
                </span>
              </label>
              <p class="field__error"></p>
            </div>

            <p class="form__alert" data-form-alert hidden></p>

            <button class="btn btn--primary" type="submit" data-i18n="forms.submitSchool"></button>
            <p class="form__note" data-i18n="forms.demoNote"></p>
          </form>

          <div class="form__success" data-success hidden>
            <h3 data-success-title data-i18n="forms.successTitle"></h3>
            <p data-success-text></p>
            <button class="btn btn--sm mt-4" type="button" data-success-again data-i18n="forms.successAgain"></button>
          </div>
        </div>
      </div>
    </div>
  </section>

</main>
